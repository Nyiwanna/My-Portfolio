
<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width,initial-scale=1">
	<title>How Much Do You Love Me?</title>
	<link rel="stylesheet" href="style.css">
</head>
<body>
	<header>
		<h1>How Much Do You Love Me?</h1>
		<nav>
			<a href="#page-home">Home</a> |
			<a href="#page-ask">Ask</a> |
			<a href="#page-results">Results</a>
		</nav>
	</header>

	<style>
		body {
			text-align: center;
			max-width: 800px;
			margin: 0 auto;
			padding: 20px;
		}
		section {
			margin: 20px 0;
		}
	</style>

	<!-- Page 1: Home -->
	<section id="page-home">
		<h2>Welcome</h2>
		<p>This little site asks my girlfriend "Saw Yu Nwe" how much she loves me.</p>
		<p><a href="#page-ask">Go ask her</a></p>
	</section>

	<!-- Page 2: Ask (the form) -->
	<section id="page-ask">
		<h2>Ask Her</h2>
		<p><strong>I love you infinitely. What about you?</strong></p>
		<form id="love-form" action="#page-results" method="get">

			<label>How much do you love me?</label><br>
			<input type="radio" id="percent-1" name="love" value="A little">
			<label for="percent-1">A little</label><br>
			<input type="radio" id="percent-2" name="love" value="Somewhat">
			<label for="percent-2">Somewhat</label><br>
			<input type="radio" id="percent-3" name="love" value="A lot">
			<label for="percent-3">A lot</label><br>
			<input type="radio" id="percent-4" name="love" value="Infinitely">
			<label for="percent-4">Infinitely</label><br><br>

			<label for="message">A short message (optional):</label><br>
			<textarea id="message" name="message" rows="4" cols="40"></textarea><br><br>

			<button type="submit">Submit</button>
		</form>
	</section>

	<!-- Page 3: Results (static placeholder; user JS can update this) -->
	<section id="page-results">
		<h2>Results</h2>
		<p id="result-summary">Please Choose Infinitely</p>
		<p><a href="#page-ask">Ask again</a> | <a href="#page-home">Home</a></p>
	</section>


	<!-- Embedded JS (was dev1.js) -->
	<script>
	// Read the form, show results in #result-summary, and keep hash navigation
	(function(){
		var form=document.getElementById('love-form');
		var result=document.getElementById('result-summary');
		function summarize(values){
			var who=values.name?values.name.trim():'Someone';
			var love=values.love||'No selection';
			var msg=values.message?(' — "'+values.message.trim()+'"') : '';
			return who+ ' says: ' + love + msg;
		}
		function readForm(){
			var data={};
			data.name=document.getElementById('name').value;
			var radios=document.getElementsByName('love');
			for(var i=0;i<radios.length;i++){if(radios[i].checked){data.love=radios[i].value;break}}
			data.message=document.getElementById('message').value;
			return data;
		}
		form.addEventListener('submit',function(e){
			e.preventDefault();
			var data=readForm();
			result.textContent=summarize(data);
			location.hash='#page-results';
		});
		// If user navigates to results with query params (optional), parse and show
		window.addEventListener('hashchange',function(){
			if(location.hash==='#page-results'){
				// nothing extra; keep current result
			}
		});
	})();
	</script>
</body>
</html>
